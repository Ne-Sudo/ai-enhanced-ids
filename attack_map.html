        <script type="text/javascript">

              // initialize global variables.

              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "red", "id": "192.168.0.24", "label": "192.168.0.24", "shape": "dot"}, {"color": "blue", "id": "34.105.234.90", "label": "34.105.234.90", "shape": "dot"}, {"color": "blue", "id": "104.18.36.199", "label": "104.18.36.199", "shape": "dot"}, {"color": "blue", "id": "13.69.239.77", "label": "13.69.239.77", "shape": "dot"}, {"color": "blue", "id": "52.142.124.215", "label": "52.142.124.215", "shape": "dot"}, {"color": "blue", "id": "142.251.29.139", "label": "142.251.29.139", "shape": "dot"}, {"color": "red", "id": "172.67.162.114", "label": "172.67.162.114", "shape": "dot"}, {"color": "red", "id": "104.21.66.173", "label": "104.21.66.173", "shape": "dot"}, {"color": "blue", "id": "20.189.173.4", "label": "20.189.173.4", "shape": "dot"}, {"color": "blue", "id": "143.204.68.50", "label": "143.204.68.50", "shape": "dot"}, {"color": "blue", "id": "52.123.242.54", "label": "52.123.242.54", "shape": "dot"}, {"color": "blue", "id": "20.189.173.26", "label": "20.189.173.26", "shape": "dot"}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;

                  allEdges = edges.get({ returnType: "Object" });

                  var options = {

            "fit": true,

};

                  


                  

                  network = new vis.Network(container, data, options);

              }
